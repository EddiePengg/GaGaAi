; gaga ai 设备固件 —— ESP-IDF / PlatformIO 工程（ADR-020）
; 协议（BLE UUID/帧格式/MQTT topic）权威：../docs/protocol.md
; 框架：PlatformIO espressif32@6.13.x 自带 ESP-IDF v5.5.x（BSP 要求 idf>=5.5）
; 当前开发板与多板构建：main/boards/<board>/ + scripts/build.py（见 README；
; 组件依赖（BSP/LVGL 等）声明在 main/idf_component.yml，由 IDF Component
; Manager 拉取到 managed_components/）

[platformio]
; 主组件目录对齐 xiaozhi-esp32 叫 main/（默认是 src/）
src_dir = main
default_envs = waveshare-s3-amoled-1_75

[env:waveshare-s3-amoled-1_75]
; ⚠️ 本 env 是"本地开发快捷入口"（保住 pio run 的 muscle memory），参数是
; main/boards/waveshare-s3-amoled-1_75c/config.json 的手维护镜像——改板级参数
; 以 config.json 为准并同步这里；多板构建/发布入口是 scripts/build.py
;（list / build / --all / --matrix，ADR-077）。
platform = espressif32@^6.13.0
board = esp32-s3-devkitc-1
framework = espidf

monitor_speed = 115200
; 原生 USB（USB-Serial-JTAG）忽略波特率，此项仅作 UART 备援
upload_speed = 921600

; ---- 选板（main/boards/common/board_selected.h 按此宏包含板目录头文件）----
; 当前仅一块在册板子。新增板子 = 复制本 env + 新 -DGAGA_BOARD_<NAME> +
; 分板 sdkconfig.defaults（PSRAM/flash 差异随芯片走，当前 32MB Flash / 8MB
; PSRAM 是这块 S3 的实测值）。CI 构建矩阵属发布期需求，届时再做。
build_flags =
    -DGAGA_BOARD_WAVESHARE_1_75C

; 32MB Flash（0x2000000，esptool 实测；与 sdkconfig.defaults 的
; CONFIG_ESPTOOLPY_FLASHSIZE_32MB 必须一致，否则构建期告警）
board_upload.flash_size = 32MB
; pio 侧的分区表来源也必须显式指定：否则它用默认 partitions_singleapp.csv 生成
; partitions.bin 并按 1MB 做体积检查（与 sdkconfig 的自定义分区不一致）
board_build.partitions = partitions.csv
; pio 的体积检查默认按板级 manifest（esp32-s3-devkitc-1 = 1MB app），
; 这里对齐到 partitions.csv 的 8MB factory 槽位
board_upload.maximum_size = 8388608
