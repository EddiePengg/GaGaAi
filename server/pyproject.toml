[project]
name = "gaga-server"
version = "0.1.0"
description = "gaga ai 服务端：MQTT 桥 + 帧重组 + Whisper ASR + 飞书 webhook"
requires-python = ">=3.12"
dependencies = [
    "paho-mqtt>=2.1",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "python-multipart>=0.0.9",
    "faster-whisper>=1.1",
    "httpx>=0.27",
    "websockets>=13",
    "pyserial>=3.5",
    "lark-oapi>=1.7.3",
]

[project.scripts]
gaga-server = "gaga_server.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gaga_server"]
