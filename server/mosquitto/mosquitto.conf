# gaga-server broker（docs/protocol.md §4：Broker 由服务器提供）
#
# 2026-09-27 公网暴露（ADR-061）：开鉴权——匿名公网 MQTT 会被扫描器
# 分钟级发现（Shodan 常年扫 1883），而 topic 全公开在 protocol.md：
# ① 订 gaga/down 偷听全部对话转写（receipt/reply）；
# ② 伪造设备发 gaga/up 刷你的飞书群 + 烧 ASR/LLM 账单；
# ③ 用 clientId "server" 连接互踢，直接瘫痪服务端。
# 密码文件由 mosquitto_passwd 生成（步骤见 server/README.md「公网部署」）。
# password_file 相对**启动目录**解析（mosquitto 2.x 实测，不是相对 conf 目录）：
# 本地起法固定「在 server/ 目录下启动」→ mosquitto/passwd。
# docker 部署用 mosquitto-docker.conf（绝对路径 /mosquitto/config/passwd）。
listener 1883 0.0.0.0
allow_anonymous false
password_file mosquitto/passwd
persistence false
log_dest stdout
